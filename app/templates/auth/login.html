{% extends "base.html" %}

{% block title %}Log In - Todo App{% endblock %}

{% block main_class %}auth-main{% endblock %}

{% block content %}
<div class="auth-split">
    <div class="auth-panel">
        <div class="auth-panel-inner">
            <h1>Get things done.</h1>
            <p>Your tasks, organized and in reach.</p>
            <svg class="auth-illustration" viewBox="0 0 240 220" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="20" y="20" width="200" height="180" rx="12" fill="var(--pico-card-background-color)" stroke="var(--pico-primary)" stroke-width="2"/>
                <!-- Row 1 checked -->
                <rect x="40" y="50" width="20" height="20" rx="4" fill="var(--pico-primary)"/>
                <polyline points="44,60 49,65 56,55" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="72" y="54" width="100" height="6" rx="3" fill="var(--pico-primary)" opacity="0.3"/>
                <rect x="72" y="64" width="70" height="4" rx="2" fill="var(--pico-muted-color)" opacity="0.3"/>
                <!-- Row 2 checked -->
                <rect x="40" y="90" width="20" height="20" rx="4" fill="var(--pico-primary)"/>
                <polyline points="44,100 49,105 56,95" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="72" y="94" width="120" height="6" rx="3" fill="var(--pico-primary)" opacity="0.3"/>
                <rect x="72" y="104" width="55" height="4" rx="2" fill="var(--pico-muted-color)" opacity="0.3"/>
                <!-- Row 3 unchecked -->
                <rect x="40" y="130" width="20" height="20" rx="4" fill="none" stroke="var(--pico-muted-border-color)" stroke-width="2"/>
                <rect x="72" y="134" width="90" height="6" rx="3" fill="var(--pico-muted-color)" opacity="0.25"/>
                <rect x="72" y="144" width="60" height="4" rx="2" fill="var(--pico-muted-color)" opacity="0.2"/>
                <!-- Row 4 unchecked -->
                <rect x="40" y="164" width="20" height="20" rx="4" fill="none" stroke="var(--pico-muted-border-color)" stroke-width="2"/>
                <rect x="72" y="168" width="110" height="6" rx="3" fill="var(--pico-muted-color)" opacity="0.25"/>
            </svg>
        </div>
    </div>
    <div class="auth-form-panel">
        <article>
            <h2>Log In</h2>
            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <label for="email">Email</label>
                <input type="text" id="email" name="email" required autofocus
                       placeholder="you@example.com">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                <button type="submit">Log In</button>
            </form>
            <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
        </article>
    </div>
</div>
{% endblock %}
