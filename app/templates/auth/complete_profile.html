{% extends "base.html" %}

{% block title %}Complete Your Profile - Todo App{% endblock %}

{% block content %}
<article>
    <h2>Complete Your Profile</h2>
    <p>Please provide your email and name to continue using the app.</p>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus>
        <label for="first_name">First Name</label>
        <input type="text" id="first_name" name="first_name" required maxlength="100">
        <label for="last_name">Last Name</label>
        <input type="text" id="last_name" name="last_name" required maxlength="100">
        <button type="submit">Save Profile</button>
    </form>
</article>
{% endblock %}
