{% extends "base.html" %}

{% block title %}Reset Password - Todooly{% endblock %}

{% block main_class %}auth-main{% endblock %}

{% block content %}
<div class="auth-split">
    <div class="auth-panel">
        <div class="auth-panel-inner">
            <h1>Get things done.</h1>
            <p>Your tasks, organized and in reach.</p>
        </div>
    </div>
    <div class="auth-form-panel">
        <article>
            <h2>Set New Password</h2>
            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <label for="new_password">New password</label>
                <input type="password" id="new_password" name="new_password" required autofocus
                       autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
                <label for="confirm_password">Confirm new password</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                       autocomplete="new-password" minlength="8">
                <button type="submit">Reset Password</button>
            </form>
            <p><a href="{{ url_for('auth.login') }}">Back to log in</a></p>
        </article>
    </div>
</div>
{% endblock %}
