{% extends "base.html" %}

{% block title %}Edit Todo{% endblock %}

{% block content %}
<article>
    <h2>Edit Todo</h2>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="{{ todo['title'] }}" required maxlength="200" autofocus>
        <label for="due_date">Due Date</label>
        <input type="date" id="due_date" name="due_date" value="{{ todo['due_date'] or '' }}">
        <label for="tags">Tags</label>
        <input type="text" id="tags" name="tags" value="{{ todo_tags | join(', ') }}" placeholder="Tags (comma-separated)" list="tag-suggestions">
        {% if all_tags %}
        <datalist id="tag-suggestions">
            {% for t in all_tags %}
            <option value="{{ t }}">
            {% endfor %}
        </datalist>
        {% endif %}
        <div role="group">
            <button type="submit">Save</button>
            <a href="{{ url_for('todos.list_todos') }}" role="button" class="secondary">Cancel</a>
        </div>
    </form>
</article>
{% endblock %}
