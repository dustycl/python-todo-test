<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; color: #333;">
  <h1 style="color: #1a73e8;">Reset your password</h1>
  <p>Hi {{ first_name }},</p>
  <p>We received a request to reset your Todooly password. Click the button below to set a new password.</p>
  <p>
    <a href="{{ reset_url }}" style="display: inline-block; background: #1a73e8; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold;">Reset Password</a>
  </p>
  <p>This link expires in 1 hour. If you didn't request a password reset, you can safely ignore this email.</p>
  <p>The Todooly Team</p>
</body>
</html>
